name: Render reels

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition to render (blank = all)'
        required: false
        default: ''
  # Manual only. Rendering four reels takes ~5 minutes of runner time, and
  # local renders are the source of truth for what gets published, so there
  # is no reason to burn minutes on every push.

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Remotion renders in headless Chrome, which needs these system libs.
      # libasound2 was renamed libasound2t64 in Ubuntu 24.04, so try both.
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - run: npm ci

      - name: Ensure Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Type check
        run: npx tsc --noEmit

      - name: Render
        run: |
          mkdir -p out
          if [ -n "${{ github.event.inputs.composition }}" ]; then
            npx remotion render "${{ github.event.inputs.composition }}" \
              "out/${{ github.event.inputs.composition }}.mp4" --log=error
          else
            npx remotion render FractionReel        out/fraction-reel.mp4              --log=error
            npx remotion render FractionReelV2      out/fraction-reel-v2.mp4           --log=error
            npx remotion render FractionReelV3      out/fraction-reel-v3.mp4           --log=error
            npx remotion render FractionReelV3VO    out/fraction-reel-v3-voiceover.mp4 --log=error
          fi
          ls -lh out

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: out/*.mp4
          retention-days: 30

      # NOTE: this workflow deliberately does NOT publish to Releases.
      # softprops/action-gh-release deletes every existing asset before
      # re-uploading; a single failed upload then leaves the release
      # incomplete (this happened on v1.0.0 and dropped fraction-reel-v3.mp4).
      # Publish release assets from a verified local render instead:
      #   gh release upload <tag> out/*.mp4 --clobber
